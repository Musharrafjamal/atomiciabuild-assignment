name: clinic-shift-scheduler

services:
  # Single-node replica set. A plain `mongo` image runs standalone, which supports
  # NEITHER multi-document transactions NOR change streams -- the two features the
  # claim engine (src/lib/rules) and live updates (/api/stream) are built on. Using
  # the Atlas-local image keeps dev behaviour identical to the Atlas M0 deployment.
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: clinic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `mongosh --eval "db.adminCommand('ping')"` returns ok only once the replica
      # set has finished electing a primary, so the app never starts against a node
      # that would reject transactions with NotWritablePrimary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: clinic-app
    ports:
      # Overridable, because 3000 is a popular port and a reviewer who already
      # has something on it should not have to edit this file:
      #   APP_PORT=3300 docker compose up
      - "${APP_PORT:-3000}:3000"
    environment:
      # directConnection=true, and deliberately NO replicaSet= parameter: the
      # atlas-local image names its replica set after the container ID rather than
      # a fixed "rs0", so pinning a name makes the driver reject the server as a
      # setName mismatch. directConnection skips topology discovery and talks to
      # the node directly, which still supports transactions and change streams
      # because the node itself is a replica set primary.
      MONGODB_URI: mongodb://mongo:27017/clinic?directConnection=true
      AUTH_SECRET: dev-only-secret-change-in-production-0123456789abcdef
      CLINIC_TZ: Europe/London
      NEXT_PUBLIC_CLINIC_TZ: Europe/London
      SEED_ON_BOOT: "true"
      WATCH_MODE: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
